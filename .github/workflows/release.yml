name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      HAS_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 != '' }}
      HAS_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD != '' }}
      HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
      HAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
      HAS_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require signing and notarization secrets
        run: |
          for value in +            "$HAS_CERTIFICATE" +            "$HAS_CERTIFICATE_PASSWORD" +            "$HAS_APPLE_ID" +            "$HAS_TEAM_ID" +            "$HAS_APP_PASSWORD"; do
            if [ "$value" != "true" ]; then
              echo "Stable releases require every Developer ID and notarization secret." >&2
              exit 1
            fi
          done

      - name: Select latest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Resolve release version
        id: version
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use semantic versioning, for example v0.3.1." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp app version
        run: |
          plutil -replace CFBundleShortVersionString -string "${{ steps.version.outputs.version }}" Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Info.plist
          plutil -insert ZarathustraBuildTag -string "${{ steps.version.outputs.tag }}" Info.plist

      - name: Build release notes
        id: release_notes
        run: |
          .github/scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"
          {
            echo "body<<EOF"
            cat "$RUNNER_TEMP/release-notes.md"
            echo
            echo "## Download"
            echo
            echo "**[Zarathustra.dmg](https://github.com/qoodeng/zarathustra/releases/download/${{ steps.version.outputs.tag }}/Zarathustra.dmg)** — requires macOS 26 (Tahoe)."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run deterministic tests
        run: make test

      - name: Install build tools
        run: brew install create-dmg fileicon

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" +            -P "$CERTIFICATE_PASSWORD" +            -A +            -t cert +            -f pkcs12 +            -k "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: +            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "No usable Developer ID Application identity was imported." >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" +            --apple-id "$APPLE_ID" +            --team-id "$APPLE_TEAM_ID" +            --password "$APPLE_APP_PASSWORD" +            --keychain "$KEYCHAIN_PATH"

      - name: Build signed universal app
        run: |
          make ARCH=universal +            APP_NAME=Zarathustra +            BUNDLE_ID=com.qoodeng.zarathustra +            CODESIGN_IDENTITY="$CODESIGN_IDENTITY"

      - name: Verify signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --verify --deep --strict --verbose=2 build/Zarathustra.app
          codesign -dv --verbose=4 build/Zarathustra.app 2>&1 |
            grep -F "TeamIdentifier=$APPLE_TEAM_ID"
          codesign -dr - build/Zarathustra.app 2>&1 |
            grep -F "identifier \"com.qoodeng.zarathustra\""

      - name: Create and sign DMG
        run: |
          make dmg ARCH=universal +            APP_NAME=Zarathustra +            BUNDLE_ID=com.qoodeng.zarathustra +            CODESIGN_IDENTITY="$CODESIGN_IDENTITY"
          codesign --force --sign "$CODESIGN_IDENTITY" build/Zarathustra.dmg
          codesign --verify --strict --verbose=2 build/Zarathustra.dmg

      - name: Notarize and staple DMG
        run: |
          xcrun notarytool submit build/Zarathustra.dmg +            --keychain-profile "notarytool-profile" +            --keychain "$KEYCHAIN_PATH" +            --wait
          xcrun stapler staple build/Zarathustra.dmg
          xcrun stapler validate build/Zarathustra.dmg

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Zarathustra ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          generate_release_notes: false
          make_latest: true
          files: build/Zarathustra.dmg

      - name: Cleanup signing artifacts
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer_id.p12"
          KPATH="${KEYCHAIN_PATH:-$RUNNER_TEMP/signing.keychain-db}"
          if [ -f "$KPATH" ]; then
            security delete-keychain "$KPATH"
          fi
